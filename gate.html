<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Naja Byg — hjemmeside kommer snart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="style.css">

    <style>
        /* Adgangssiden har sit eget layout — men samme tokens som resten af sitet. */
        body {
            background: var(--nb-bg-inverse);
            color: var(--nb-text-on-dark);
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: var(--sp-8) var(--sp-6);
        }

        .gate {
            width: 100%;
            max-width: 420px;
            text-align: left;
        }

        .gate h1 {
            font-size: clamp(1.9rem, 5vw, 2.6rem);
            line-height: 1.08;
            color: var(--nb-sand-50);
            margin: var(--sp-8) 0 var(--sp-4);
        }

        .gate p { color: var(--nb-text-muted-dark); }

        .gate form { margin-top: var(--sp-8); display: grid; gap: var(--sp-3); }

        .gate input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--nb-sand-50);
            background: var(--nb-teal-800);
            border: 1px solid var(--nb-sten-500);
            border-radius: var(--nb-radius);
        }
        .gate input::placeholder { color: var(--nb-sten-400); }
        .gate input:focus-visible {
            outline: 2px solid var(--nb-accent-on-dark);
            outline-offset: 1px;
            border-color: var(--nb-accent-on-dark);
        }
        .gate input.error { border-color: var(--nb-rust-400); }

        .gate .err {
            font-size: .9rem;
            color: var(--nb-rust-400);
            visibility: hidden;
        }
        .gate .err.visible { visibility: visible; }

        .gate-foot {
            margin-top: clamp(40px, 8vw, 72px);
            padding-top: var(--sp-6);
            border-top: 1px solid rgba(169, 164, 143, .24);
            font-size: .86rem;
            color: var(--nb-sten-400);
        }
        .gate-foot a { color: var(--nb-sand-100); text-decoration: none; }
        .gate-foot a:hover { color: var(--nb-rust-400); }
    </style>
</head>
<body>

    <div class="gate">
        <span class="lockup lockup--on-dark" style="font-size:1.7rem">
            <svg class="lockup-mark" viewBox="16 2 76 98" aria-hidden="true" focusable="false">
                <path class="door-open" d="M16,10 L48,10 L48,92 L16,92 Z"/>
                <path class="door-leaf" d="M48,10 L92,2 L92,100 L48,92 Z"/>
            </svg>
            <span class="lockup-text">
                <span class="lockup-name">Naja Byg</span>
                <span class="lockup-sub">Nauntofte &amp; Jacobsen</span>
            </span>
        </span>

        <h1>Hjemmesiden kommer snart</h1>
        <p>Har du fået en kode, kan du se den her.</p>

        <form id="gateForm">
            <label class="visually-hidden" for="code">Adgangskode</label>
            <input type="password" id="code" name="code" placeholder="Adgangskode"
                   autocomplete="off" autocapitalize="off" spellcheck="false" required>
            <p class="err" id="errMsg">Forkert kode. Prøv igen.</p>
            <button class="btn btn--on-dark" type="submit">Fortsæt</button>
        </form>

        <div class="gate-foot">
            <p>Skal du have fat i os nu? Ring <a href="tel:+4528186488">28 18 64 88</a>.</p>
        </div>
    </div>

    <script>
        /* Skift ACCESS_CODE til den kode I ønsker at bruge. */
        const ACCESS_CODE = 'naja2026';

        const form   = document.getElementById('gateForm');
        const input  = document.getElementById('code');
        const errMsg = document.getElementById('errMsg');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const entered = input.value.trim();

            if (entered === ACCESS_CODE) {
                sessionStorage.setItem('naja_access', 'granted');
                window.location.replace('index.html');
            } else {
                input.classList.add('error');
                errMsg.classList.add('visible');
                input.value = '';
            }
        });

        input.addEventListener('input', () => errMsg.classList.remove('visible'));
    </script>
</body>
</html>
